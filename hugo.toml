baseURL = 'https://blog.onioniworks.com/'
locale = 'ko-KR'
defaultContentLanguage = 'ko'

title = 'OniOniWorks Blog'

theme = 'PaperMod'

enableRobotsTXT = true
enableInlineShortcodes = true
enableEmoji = true

# 요약문 길이 (한국어 기준)
summaryLength = 40

[pagination]
  pagerSize = 12

# 카테고리는 택소노미가 아니라 폴더(섹션)로 관리한다.
#   content/posts/<카테고리>/<글>/  →  /posts/<카테고리>/<글>/
# 택소노미로도 두면 같은 글 목록이 /categories/<이름>/ 에 한 벌 더 생겨,
# 검색 엔진이 중복으로 읽고 독자는 어느 쪽이 진짜인지 헷갈린다.
# 카테고리 소개 페이지는 content/categories.md 가 따로 맡는다.
[taxonomies]
  tag = 'tags'

[markup]
  [markup.goldmark.renderer]
    # 본문 안 HTML 허용 — 광고 단위·요약 박스 삽입에 필요
    unsafe = true
  [markup.goldmark.extensions.extras.mark]
    # ==이렇게== 감싼 대목이 <mark>가 되어 형광펜 밑줄로 보인다.
    # 스타일은 assets/css/extended/highlight.css
    enable = true
  [markup.highlight]
    noClasses = false
    codeFences = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  env = 'production'

  # 🔴 테마 푸터를 끄고 `extend_footer.html` 에서 직접 그린다.
  # 「Powered by Hugo & PaperMod」 는 테마가 조건 없이 내보내는데, 그것만 빼려면
  # 158줄짜리 푸터 템플릿을 통째로 복사해야 하고 그러면 테마가 바뀔 때 낡는다.
  # 이 스위치는 <footer> 만 막는다 — 맨 위로 가기 단추와 스크립트는 테마가 계속 낸다.
  #
  # ⚠️ PaperMod 는 MIT 라 크레딧 표기 의무가 없다. 테마 주석도 '권장'이라 적고,
  # 지울 경우 사이트 어딘가에 저장소 링크를 두라고 안내한다. **소개 페이지에 옮겨 적었다.**
  hideFooter = true


  # ⚠️ 확정 필요 — 사장님 확인 후 교체
  description = '알아두면 돈이 되는 제도와 도구를, 출처와 기준일을 밝혀 정리합니다.'
  author = '오니오니웍스'

  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = true
  ShowRssButtonInSectionTermList = true
  comments = false

  # 애드센스 게시자 ID — 승인 후 'ca-pub-XXXXXXXXXXXXXXXX' 형태로 채운다.
  # 책 04장: 하드코딩 금지, 반드시 이 설정값을 템플릿에서 참조한다.
  adsenseClient = ''

  # 검색엔진 소유 확인 메타태그 — 서치콘솔·서치어드바이저 등록 시 채운다.
  googleSiteVerification = 'uJBozsRDfqolDY6-5JGb2ehchZU--wzwwKNcypIBfHA'
  naverSiteVerification = '8c2f801f7c082b2161f0b54568d4398680de5315'

  # GA4 측정 ID — 연결 시 'G-XXXXXXXXXX' 형태로 채운다.
  googleAnalytics = 'G-T6VEKR6LNP'

  # 사이트 머리의 로고 — 심볼은 여기 SVG, 글자는 테마가 label.text 로 낸다.
  # **글자를 그림으로 만들지 않는다.** 그래야 사이트 글꼴을 따라가고,
  # 검색·복사·화면 읽기가 되고, 화면 폭에 맞춰 접힌다.
  # fill 이 currentColor 라 어두운 화면에서는 색이 뒤집혀 그대로 보인다.
  [params.label]
    text = "OniOniWorks"
    iconHeight = 26
    iconSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="26" height="26" aria-hidden="true" style="vertical-align:-5px;margin-right:7px"><path d="M13 0h38a13 13 0 0113 13v38a13 13 0 01-13 13H13A13 13 0 010 51V13A13 13 0 0113 0z M12.5 32a9.5 9.5 0 1019 0 9.5 9.5 0 10-19 0z M32.5 32a9.5 9.5 0 1019 0 9.5 9.5 0 10-19 0z" fill="currentColor" fill-rule="evenodd"/></svg>'

  [params.homeInfoParams]
    Title = '오니오니웍스'
    Content = '제도와 도구를 직접 확인하고, 출처와 기준일을 밝혀 정리합니다.'

  [params.assets]
    disableHLJS = true
    # 파비콘 — 오니오니의 두 O 를 원 두 개로 그린 것이다.
    # **테마는 설정이 없어도 이 경로들을 기본값으로 참조한다.** 파일이 없던 동안
    # /favicon.ico 등이 계속 404 였다. 이제 static/ 에 실물이 있고 경로를 명시한다.
    # 원본은 static/favicon.svg — 크기를 바꿀 때 그것에서 다시 뽑는다.
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
    safari_pinned_tab = "/safari-pinned-tab.svg"

# 상단 메뉴 — 다섯 칸으로 고정한다.
#
# 예전에는 각 폴더의 _index.md에 흩어 두었다. 주제를 늘리면 메뉴가 따라 붙게 하려던 것인데,
# 이제 주제는 카테고리 페이지 안으로 들어가고 메뉴는 늘지 않으므로 한곳에 모은다.
# 흩어 두면 "지금 메뉴가 몇 개더라"를 알려면 폴더를 전부 열어 봐야 한다.
#
# 🔴 개인정보처리방침과 이용약관은 여기에 두지 않는다. 푸터가 맡는다
# (layouts/_partials/extend_footer.html). 상단은 읽을거리를 찾는 곳이고,
# 법적 문서를 위에 올리면 정작 글로 가는 길이 좁아진다.
#
# pre 에 SVG를 넣으면 글자 대신 아이콘이 나온다. 검색만 아이콘을 쓴다 —
# 다섯 칸이 전부 글자면 어디를 눌러야 찾는 곳인지 한눈에 안 들어온다.
[menus]
  [[menus.main]]
    name = 'About'
    url = '/about/'
    weight = 10
  [[menus.main]]
    name = 'Posts'
    url = '/posts/'
    weight = 20
  [[menus.main]]
    name = 'Categories'
    url = '/categories/'
    weight = 30
  [[menus.main]]
    name = 'Contact'
    url = '/contact/'
    weight = 50
  # 🔴 좁은 화면에서는 이 셋(Categories·Privacy·Terms)이 접힌다
  # (assets/css/extended/menu.css). 375px 에 일곱 칸은 들어가지 않는다 — 실측했다.
  # **접히는 대신 푸터에 같은 링크를 둔다.** Categories 는 /posts/ 에서 닿는다.
  [[menus.main]]
    name = 'Privacy'
    url = '/privacy/'
    weight = 60
  [[menus.main]]
    name = 'Terms'
    url = '/terms/'
    weight = 70
  [[menus.main]]
    identifier = 'search'
    name = ''          # 비워야 아이콘만 남는다. 읽어 주는 이름은 title이 맡는다
    title = '검색'
    url = '/search/'
    weight = 80
    pre = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>'

# 태그 목록 페이지(/tags/ 와 /tags/<태그>/)는 검색에 올리지 않는다.
#
# 글 25편에 태그 46개인데 그중 22개는 글이 한 편뿐이다. 글 한 편짜리 태그 페이지는
# 그 글의 제목과 요약만 있어 원글과 겹친다. 구글도 같은 판정을 내려
# 서치 콘솔에 '발견됨 - 현재 색인이 생성되지 않음' 경고 18개가 쌓였다.
#
# 경고를 그냥 두면 나중에 진짜 문제 — 본문 글이 색인되지 않는 일 — 가 그 안에 묻힌다.
# 그래서 우리 설정을 구글의 판정과 일치시킨다.
#
# 태그는 독자가 사이트 안에서 관련 글을 찾는 도구로 남는다. 검색 노출은 본문 글이 맡는다.
# ⚠️ 테마가 robotsNoIndex 를 'noindex, nofollow' 로 낸다 — follow 만 남길 수는 없다.
# 태그 페이지에서만 닿는 글은 없으므로(카테고리 목록·사이트맵·관련 글이 모두 닿는다) 그대로 둔다.
# ⚠️ kind 는 문자열 하나만 받는다 — 배열을 넣으면 빌드가 죽는다. 그래서 블록 둘로 나눈다.
[[cascade]]            # /tags/ — 태그 목록
  [cascade.params]
    robotsNoIndex = true
  [cascade.sitemap]
    disable = true
  [cascade.target]
    kind = 'taxonomy'

[[cascade]]            # /tags/<태그>/ — 태그별 글 목록
  [cascade.params]
    robotsNoIndex = true
  [cascade.sitemap]
    disable = true
  [cascade.target]
    kind = 'term'

# 글 폴더에 들어 있는 원본 이미지를 그대로 배포하지 않는다.
# 렌더 훅이 만든 webp만 나간다. 원본은 저장소에만 남아 다시 처리할 때 쓰인다.
# 이게 없으면 무거운 원본이 발행본에 함께 실려 정적 사이트의 속도 이점을 깎아먹는다.
[[cascade]]
  [cascade.build]
    publishResources = false
  [cascade.target]
    path = '/**'

# 함께 보면 좋은 글 — 태그가 겹치는 글을 골라 준다.
# 관련 글 추천이 동작하려면 태그가 일관돼야 한다. 그래서 태그 사전을 고정해 뒀다
# (도구 저장소 niches/<니치>/taxonomy.md).
#
# threshold 는 '얼마나 닮아야 관련 글로 볼지'다. 80이면 태그가 상당히 겹쳐야 하고,
# 낮추면 아무 글이나 붙는다. 글이 적을 때는 추천이 비는 편이 엉뚱한 글을 붙이는 것보다 낫다.
[related]
  includeNewer = true      # 나중에 쓴 글도 후보에 넣는다
  threshold = 80
  toLower = true

  [[related.indices]]
    name = 'tags'
    weight = 100

  [[related.indices]]
    name = 'date'
    weight = 10

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[sitemap]
  changefreq = 'weekly'
  priority = 0.5
  filename = 'sitemap.xml'
